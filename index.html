<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite - Vamos Sambar! Aniversário Érica Lemos</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4ebd0;
            background-image: radial-gradient(#d4c5a9 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: 'Montserrat', sans-serif;
            color: #2b3e2b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #fffdf9;
            border: 4px solid #355e3b;
            border-radius: 15px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        /* Marca d'água Corinthians */
        .card::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            background-image: url('https://upload.wikimedia.org/wikipedia/pt/b/b4/Corinthians_simbolo.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.08;
            pointer-events: none;
            z-index: 0;
        }

        .card > * {
            position: relative;
            z-index: 1;
        }

        /* Estilos Gerais de Texto */
        h1 {
            font-family: 'Caveat', cursive;
            font-size: 3.5rem;
            color: #a63a2b;
            margin-bottom: 10px;
        }
        
        .name-aniversariante {
            font-family: 'Caveat', cursive;
            font-size: 2.8rem;
            color: #a63a2b;
            margin-bottom: 20px;
        }

        p { font-size: 1.1rem; margin-bottom: 20px; color: #355e3b; font-weight: 600; }

        /* Botões */
        .btn-acao {
            background-color: #355e3b;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(53, 94, 59, 0.4);
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .btn-acao:hover { background-color: #244027; transform: translateY(-3px); }

        /* Telas */
        #invite-screen, #audio-controls { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Bloco de Surpresa */
        .surpresa-box {
            border: 2px dashed #355e3b;
            background: #faf6ed;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .surpresa-texto { text-decoration: line-through; color: #a63a2b; font-weight: bold; }
        .nao-e-mais { background: #d4a373; color: #fff; font-family: 'Caveat', cursive; font-size: 1.4rem; padding: 2px 10px; transform: rotate(-1deg); display: inline-block; margin-top: 5px;}

        /* Botão de Áudio */
        .btn-som {
            background-color: #a63a2b;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-som:hover { background-color: #8c2f22; }
        .icone-som { font-size: 1.5rem; }

    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <div id="welcome-screen">
                <p>🎶 Convite Especial 🎶</p>
                <h1>Vai rolar um samba!</h1>
                <p>Toque abaixo para abrir o convite.</p>
                <button class="btn-acao" onclick="revelarConvite()">Abrir Convite 🥁</button>
            </div>

            <div id="invite-screen">
                <h2>Vamos Sambar!</h2>
                <p class="subtitle">Aniversário da</p>
                <div class="name-aniversariante">Érica Lemos!</div>

                <div class="surpresa-box">
                    <div class="surpresa-texto">É SURPRESA!</div>
                    <div class="nao-e-mais">NÃO É MAIS... a Érica não é fácil!</div>
                </div>

                <button id="btn-liberar-som" class="btn-som" onclick="prepararSom()">
                    <span class="icone-som">🔊</span> Ativar Grito da Torcida
                </button>

                <div id="audio-controls">
                    <p style="color: #355e3b; font-size: 1rem; margin-top: 10px;">✅ Áudio pronto! Clique abaixo:</p>
                    <button class="btn-som" onclick="tocarGrito()">
                        <span class="icone-som">📣</span> GRITAR VAI CORINTHIANS!
                    </button>
                </div>

                <div id="mensagem-final" style="display: none; margin-top: 15px; font-weight: bold;">
                   Prepare o fígado, o pé de valsa e o grito! 🏴🏳️🍻
                </div>

            </div>
        </div>
    </div>

    <audio id="gritoAudio" preload="auto">
        <source src="https://www.myinstants.com/media/sounds/vai-corinthians-grito.mp3" type="audio/mpeg">
        Seu navegador não suporta o elemento de áudio.
    </audio>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const inviteScreen = document.getElementById('invite-screen');
        const btnLiberar = document.getElementById('btn-liberar-som');
        const audioControls = document.getElementById('audio-controls');
        const mensagemFinal = document.getElementById('mensagem-final');
        const audio = document.getElementById('gritoAudio');

        function revelarConvite() {
            welcomeScreen.style.display = 'none';
            inviteScreen.style.display = 'block';
            inviteScreen.style.animation = 'fadeIn 0.8s ease-in-out';
        }

        // Passo 1: O usuário clica para liberar o som (requisito do navegador)
        function prepararSom() {
            btnLiberar.style.display = 'none'; // Esconde o botão de liberar
            audioControls.style.display = 'block'; // Mostra o botão de gritar
            mensagemFinal.style.display = 'block';
            
            // Carrega o áudio e tenta dar play/pause rápido para "desbloquear" o som no iOS/Chrome
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
            }).catch(error => console.log("Erro ao preparar som: ", error));
        }

        // Passo 2: O usuário clica para tocar o grito
        function tocarGrito() {
             // Reinicia o áudio para garantir que toque do começo se clicado várias vezes
            audio.currentTime = 0;
            audio.play().catch(error => alert("Erro ao reproduzir áudio: " + error));
        }
    </script>
</body>
</html>
